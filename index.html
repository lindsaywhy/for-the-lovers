<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d1d16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="For the Lovers">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='100' cy='100' r='96' fill='%230d1d16' stroke='%23f4a6bf' stroke-width='8'/%3E%3Ctext x='100' y='132' text-anchor='middle' font-family='Impact,sans-serif' font-size='96' fill='%23f4a6bf'%3EYJ%3C/text%3E%3C/svg%3E">
<title>For the Lovers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Caveat:wght@600&family=Anton&family=Pinyon+Script&family=Outfit:wght@300;400;500;600;800&display=swap">
<style>
/* Layout: a single late-night screen — dashboard, a big playing card, and a tab bar along the bottom. Deliberately one dark look: his deep forest green, her pink. */
:root{
  --bg:#0d1d16;
  --bg2:#132a20;
  --surface:#1a3629;
  --line:#2c4d3e;
  --fg:#f7eef0;
  --muted:#a9c2b5;
  --rose:#f4a6bf;
  --amber:#f9cdd8;
  --deep:#0a1711;
  --d-know:#8fc4d9; --d-sweet:#f9cdd8; --d-flirty:#f4a6bf; --d-date:#9fd8a8; --d-dark:#e0609a; --d-wild:#e8d9b0; --d-brat:#ff6fae; --d-deep:#b9a7e8; --d-yesno:#ffb38a; --d-yessir:#7fd6c2; --d-music:#f2c27b;
  --display:"Gloock", Georgia, "Times New Roman", serif;
  --body:"Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body.pat::before{content:"";position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22220%22%20height%3D%22220%22%20viewBox%3D%220%200%20220%20220%22%3E%3Cg%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M40%2052c-3-6-12-4-11%203%201%205%2011%2011%2011%2011s10-6%2011-11c1-7-8-9-11-3z%22%20stroke%3D%22%23f4a6bf%22%20stroke-width%3D%221.4%22%20transform%3D%22rotate%28-14%2040%2056%29%22/%3E%3Cpath%20d%3D%22M160%20158c-2-4-8-3-7%202%20.5%203.5%207%207.5%207%207.5s6.5-4%207-7.5c1-5-5-6-7-2z%22%20stroke%3D%22%237fbf9a%22%20stroke-width%3D%221.2%22%20transform%3D%22rotate%2812%20160%20162%29%22/%3E%3Ccircle%20cx%3D%22170%22%20cy%3D%2248%22%20r%3D%221.4%22%20fill%3D%22%23f4a6bf%22/%3E%3Ccircle%20cx%3D%2258%22%20cy%3D%22176%22%20r%3D%221.2%22%20fill%3D%22%23d9b44a%22/%3E%3C/g%3E%3C/svg%3E");background-size:220px 220px;opacity:.28;pointer-events:none;z-index:0}
body.pat #app{position:relative;z-index:1}
.sheet-wrap{position:fixed;inset:0;z-index:60;background:#050c09cc;display:flex;align-items:flex-end;justify-content:center;animation:fadein .15s}
.sheet{width:100%;max-width:520px;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto;animation:sheetup .2s ease-out}
@keyframes sheetup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.pick-list{display:flex;flex-direction:column;gap:8px}
.pick{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:#ffffff08;color:inherit;font:inherit;cursor:pointer;text-align:left}
.pick.on{border-color:var(--rose);background:#f4a6bf14}
.setup-hero{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:4px 2px}
.earn{font-size:13px;color:var(--rose);background:#f4a6bf14;border:1px solid #f4a6bf40;border-radius:12px;padding:8px 12px}
.hdr-hearts{display:inline-flex;align-items:center;gap:4px;padding:8px 12px;border-radius:999px;border:1px solid var(--rose);background:#f4a6bf1a;color:var(--rose);font:inherit;font-weight:700;font-size:15px;cursor:pointer;min-height:40px;align-self:center}
.hdr-hearts.pop{animation:hpop .45s ease}
@keyframes hpop{40%{transform:scale(1.25)}100%{transform:none}}
.burst{position:fixed;z-index:80;color:var(--rose);font-size:26px;pointer-events:none;animation:burst 1.1s cubic-bezier(.5,-0.3,.6,1) forwards;text-shadow:0 0 12px #f4a6bf88}
@keyframes burst{0%{transform:translate(0,0) scale(.4);opacity:0}15%{transform:translate(0,-30px) scale(1.2);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.5);opacity:.2}}
.npbar{display:flex;flex-direction:column;gap:6px;width:100%;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:#ffffff08;color:inherit;font:inherit;cursor:pointer;text-align:left}
.npbar.ready{border-color:var(--rose);background:#f4a6bf1a}
.npbar.done{color:var(--rose)}
.np-top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.np-n{color:var(--rose);font-weight:700;white-space:nowrap}
.np-track{height:7px;border-radius:99px;background:#ffffff14;overflow:hidden}
.np-fill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--rose),var(--amber));transition:width .4s}
.btn.locked{display:flex;justify-content:space-between;align-items:center;gap:10px;background:linear-gradient(90deg,#f4a6bf40 var(--pct),#ffffff08 var(--pct));border:1px dashed #f4a6bf80;color:var(--fg)}
.btn.locked .lk-n{color:var(--rose);font-weight:700;white-space:nowrap}
.avwrap.mid{width:150px}
.sentbar{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-radius:14px;background:#f4a6bf1a;border:1px solid var(--rose);font-size:14px}
.sentbar span{flex:1;min-width:0}
.now-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.now-list li{font-size:15px}
.start.secondary{background:transparent;color:var(--rose);border:1px solid var(--rose);box-shadow:none;font-size:18px;padding:12px}
.playbar{position:sticky;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-direction:column;gap:8px;padding:10px;margin:0 -6px;border-radius:20px;background:#0d1d16ee;backdrop-filter:blur(8px);border:1px solid var(--line)}
.back-info{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:18px}
.back-lv{font-size:13px;color:var(--muted)}
a.btn{color:inherit;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.jar-empty{color:var(--muted);opacity:.5;letter-spacing:.2em;font-size:18px;margin:auto}
.flyoff{animation:flyoff .95s cubic-bezier(.3,.6,.4,1) forwards;transform-origin:50% 40%}
@keyframes flyoff{0%{transform:none;opacity:1}25%{transform:translate(calc(var(--fx)*.25),-26px) rotate(-5deg);opacity:1}100%{transform:translate(var(--fx),170px) rotate(26deg);opacity:0}}
.avsvg.bounce{animation:avbounce .6s ease;transform-origin:50% 100%}
@keyframes avbounce{30%{transform:scale(1.04,.96)}60%{transform:scale(.98,1.03)}100%{transform:none}}
.avpop{position:fixed;z-index:76;color:var(--rose);font-size:20px;pointer-events:none;animation:avpop 1.1s ease-out forwards;text-shadow:0 0 10px #f4a6bf99}
@keyframes avpop{0%{transform:translateY(0) scale(.4);opacity:0}20%{opacity:1;transform:translateY(-10px) scale(1.1)}100%{transform:translateY(-70px) scale(.8);opacity:0}}
.owed-row,.bank-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:#ffffff08;border:1px solid var(--line)}
.owed-text{font-size:15px;overflow-wrap:anywhere}
.chk{width:30px;height:30px;min-width:30px;border-radius:50%;border:2px solid var(--rose);background:transparent;cursor:pointer;padding:0}
.chk:active{background:var(--rose)}
.bank-row .btn{white-space:nowrap}
.chip.idea{cursor:pointer;background:#f4a6bf14;border-color:#f4a6bf66;color:var(--fg);font:inherit;font-size:13px}
.tot-card{touch-action:none;user-select:none;transition:transform .15s;position:relative;min-height:260px;justify-content:space-between}
.tot-card.dragging{transition:none}
.tot-card[data-lean="agree"]{box-shadow:inset 0 0 0 2px var(--d-date)}
.tot-card[data-lean="nah"]{box-shadow:inset 0 0 0 2px var(--d-dark)}
.tot-card[data-lean="maybe"]{box-shadow:inset 0 0 0 2px var(--amber)}
.tot-text{font-size:26px;text-align:center;margin:12px 0}
.tot-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tot-btns .btn{padding-inline:6px}
.tot-ans{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.tot-reveal{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:16px;border:1px solid var(--line);background:#ffffff0a}
.tot-reveal.same{border-color:var(--rose);background:#f4a6bf1a}
.tot-q{font-size:16px}
.pick-wrap{display:flex;align-items:center;gap:6px}
.pick-wrap .pick{flex:1;min-width:0}
.gip{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:#ffffff08;color:inherit;font:inherit;cursor:pointer}
.gip.hot{border-color:var(--rose);background:#f4a6bf12}
.gip{padding:0;gap:0;overflow:hidden}
.gip-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;padding:12px 14px;background:none;border:0;color:inherit;font:inherit;cursor:pointer;text-align:left}
.gip-more{align-self:stretch;width:44px;flex:none;background:none;border:0;border-left:1px solid var(--line);color:var(--muted);font-size:22px;cursor:pointer}
.now-row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#ffffff06;color:inherit;font:inherit;font-size:15px;text-align:left;cursor:pointer}
.now-go{color:var(--rose);font-size:20px;line-height:1}
.free-banner{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;border:1px solid var(--amber);background:#c8a96b14}
.pricegrid{display:grid!important;grid-template-columns:repeat(6,1fr);border-radius:16px!important}
@media (max-width:380px){.pricegrid{grid-template-columns:repeat(3,1fr)}}
.fold>summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:"+";color:var(--rose);font-size:22px;line-height:1}
.fold[open]>summary::after{content:"–"}
.fold-t{font-family:var(--display);font-size:20px}
.fold-body{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.avstage{position:relative;display:flex;justify-content:center;align-items:flex-end;width:100%;padding:14px 0 6px;border:0;border-radius:18px;cursor:pointer;
  background:radial-gradient(60% 55% at 50% 45%,#f4a6bf38,transparent 70%),radial-gradient(80% 30% at 50% 100%,#00000055,transparent 70%),#ffffff05}
.avstage .avwrap{width:min(210px,62vw)}
.avstage-tag{position:absolute;left:10px;top:10px;font-size:13px;padding:3px 10px;border-radius:99px;background:#0d1d16cc;border:1px solid var(--line);color:var(--ink,inherit)}
.react-btn{min-width:44px;min-height:40px;border-radius:12px;border:1px solid var(--line);background:#ffffff08;font-size:20px;cursor:pointer}
.react-btn.on{border-color:var(--rose);background:#f4a6bf22}
.g-react{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:8px 10px;border-radius:12px;background:#ffffff08}
.g-react-em{font-size:18px;line-height:1.2}
.ourlist-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:#ffffff06}
.ourlist-row .ol-t{flex:1;min-width:0}
.ourlist-row.done{opacity:.8}
.chap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0}
.chap-emoji{font-size:64px;line-height:1;text-align:center;filter:drop-shadow(0 8px 20px #f4a6bf40);animation:chapIn .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes chapIn{from{transform:scale(.5) rotate(-10deg);opacity:0}to{transform:none;opacity:1}}
.reveal-card{border-color:var(--rose)}
.reveal-card.locked{border-style:dashed}
.alert-ask{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:16px;border:1px dashed var(--rose);background:#f4a6bf0d}
.al-row{display:flex;gap:10px;align-items:flex-start}
.al-dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:#ffffff33;box-shadow:0 0 0 3px #ffffff10}
.al-dot.on{background:#7ee0a3;box-shadow:0 0 0 3px #7ee0a333}
.gip .np-track{height:6px}
.games-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game-tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px 14px;border-radius:18px;border:1px solid var(--line);background:var(--bg2);color:inherit;font:inherit;text-align:left;cursor:pointer;min-height:118px}
.game-tile:last-child:nth-child(odd){grid-column:1/-1}
.gt-emoji{font-size:28px}.gt-name{font-family:var(--display);font-size:19px;line-height:1.15}.gt-sub{font-size:13px;color:var(--muted)}
.gt-badge{position:absolute;top:10px;right:10px;background:var(--rose);color:var(--deep);border-radius:999px;font-size:13px;font-weight:700;padding:2px 8px}
.gt-badge.soft{background:#ffffff18;color:var(--fg)}
.games-card{width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer;align-items:flex-start}
.wyr-opt{display:block;width:100%;padding:16px;border-radius:16px;border:1px solid var(--line);background:#ffffff0a;color:inherit;font:inherit;font-size:17px;text-align:center;cursor:pointer}
.wyr-opt:active{background:var(--rose);color:var(--deep)}
.wyr-or{text-align:center;font-family:var(--display);font-style:italic;color:var(--muted)}
.g-row{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:14px;background:#ffffff0a;border:1px solid var(--line)}
.g-q{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.g-line{font-size:14px;overflow-wrap:anywhere}.g-text{white-space:pre-wrap;overflow-wrap:anywhere}
.g-tag{font-size:13px;color:var(--rose)}
.match-card{touch-action:pan-y;user-select:none;transition:transform .15s}
.match-card.dragging{transition:none}
.match-list{display:flex;flex-wrap:wrap;gap:8px}
.match-chip{background:#f4a6bf22;border-color:var(--rose)}
.g-details summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 0}
.dice-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.die{min-height:74px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;border-radius:14px;background:#f4a6bf1f;border:1px solid var(--rose);font-size:14px;font-weight:600}
.die.blank{background:#ffffff0a;border-color:var(--line);color:var(--muted);font-size:22px}
.daily-tag{font-size:13px;letter-spacing:.06em;text-transform:uppercase;border:1px solid;border-radius:999px;padding:2px 9px}
.daily-ans{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:14px;background:#ffffff0d;border-left:3px solid var(--rose)}
.daily-ans.mine{border-left-color:var(--d-date)}
.daily-who{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.daily-text{white-space:pre-wrap;overflow-wrap:anywhere}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(120% 60% at 50% -10%, #1f4a35 0%, transparent 60%);background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:500}
.btn.primary{background:var(--rose);color:var(--deep);border-color:var(--rose)}
.btn.ghost{background:transparent}
.btn.small{padding:9px 14px;font-size:13px;min-height:40px}
.btn:disabled{opacity:.5;cursor:default}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top h1{font-size:30px;line-height:1.1}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:72px;height:72px;flex-shrink:0;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.logo svg{width:100%;height:100%;display:block}
@media (max-width:380px){.logo{width:56px;height:56px}.top h1{font-size:24px}}
.top h1 em{font-style:normal;color:var(--rose)}
.who{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:transparent}
.sync{font-size:13px;color:var(--muted)}

/* dashboard */
.stats{display:grid;grid-template-columns:1fr;gap:12px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .big{font-family:var(--display);font-size:40px;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.stat .big small{font-family:var(--body);font-size:14px;color:var(--muted);margin-left:4px}
.cal{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.calgrid{display:flex;flex-wrap:wrap;gap:4px}
.calgrid span{width:7px;height:7px;border-radius:50%;background:var(--surface)}
.calgrid .on{background:var(--rose);box-shadow:0 0 6px #f4a6bf88}
.calgrid .today{outline:1px solid var(--amber);outline-offset:1px}
.goal{height:6px;background:var(--surface);border-radius:999px;overflow:hidden}
.goal i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--amber));border-radius:999px}
.start{font-family:var(--display);font-size:22px;padding:18px;border-radius:20px;border:0;background:linear-gradient(135deg,var(--rose),var(--amber));color:var(--deep);box-shadow:0 10px 30px #f4a6bf33}

/* heat + boundaries */
.heatwrap{display:flex;flex-direction:column;gap:6px}
.heat{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.heat i{height:6px;border-radius:999px;background:var(--surface)}
.heat i.lit{background:linear-gradient(90deg,var(--amber),var(--rose))}
.heat i.lit:last-child{background:var(--d-dark)}
.cool{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--amber)}
.cool .btn{align-self:flex-start}
.btn.sw{border-color:var(--d-dark);color:var(--d-dark);background:transparent}
.connect{display:flex;flex-direction:column;gap:6px}
.seg.wide{display:grid;grid-template-columns:repeat(3,1fr)}
.seg.wide button{padding:9px 6px}
.seg.wide button[aria-pressed="true"]{background:var(--rose);color:var(--deep)}
.card .stamp{position:absolute;top:18px;right:18px;z-index:2;transform:rotate(8deg);border:2px solid var(--d-date);color:#2c7a4f;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;padding:3px 10px;border-radius:8px;background:#fdf3f5}
.card.done .text{opacity:.75}
.level{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip.paused{opacity:.45;border-style:dashed}
.chip{font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--fg)}
.pacein{display:flex;align-items:center;gap:6px;flex-shrink:0}
.pacein input{width:64px;text-align:center}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.srow>details{flex:1;min-width:0}

function readRoom(){
  const m = (location.hash||"").match(/r=([0-9a-f-]{36})\.([A-Za-z0-9_-]{8,})/);
  if(m){ room = {id:m[1], secret:m[2]}; lsSet("ftl_room", room);
    const keep = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
    if(!keep){ try{ history.replaceState(null, "", location.pathname); }catch(e){} } }
  else room = lsGet("ftl_room", null);
}
async function rpc(fn, args){
  const r = await fetch(SB_URL+"/rest/v1/rpc/"+fn, {method:"POST", headers:{apikey:SB_KEY, "Content-Type":"application/json"}, body:JSON.stringify(args)});
  if(!r.ok){ const e = new Error(await r.text()); e.status = r.status; throw e; }
  return r.json();
}
function online(ok){ if(ok!==connOK){ connOK = ok; safeRender(); } }
function save(name, keys){
  const body = JSON.parse(JSON.stringify(S[name]));
  lsSet("ah_"+name, body);
  if(!room) return Promise.resolve();
  pending[name] = (pending[name]||0) + 1;
  queues[name] = (queues[name]||Promise.resolve())
    .then(()=>{
      /* Boundaries and notes hold both people's answers: send only this phone's part, so saving at the same time never erases the other. */
      if(name==="boundaries") return rpc("ftl_merge", {p_room:room.id, p_secret:room.secret, p_key:name, p_patch:{[me]:body[me]||{}, custom:body.custom||[]}});
      if(name==="notes") return rpc("ftl_merge", {p_room:room.id, p_secret:room.secret, p_key:name, p_patch:{[me]:body[me]||null}});
      /* Avatars, hearts and coupons: send only the people this change touched. */
      if(keys && keys.length) return rpc("ftl_merge", {p_room:room.id, p_secret:room.secret, p_key:name, p_patch:Object.fromEntries(keys.map(k=>[k, body[k]===undefined?null:body[k]]))});
      return rpc("ftl_set", {p_room:room.id, p_secret:room.secret, p_key:name, p_data:body}); })
    .then(v=>{ versions[name] = v; online(true); })
    .catch(()=>{ online(false); toast("Couldn't save. Check your connection."); })
    .finally(()=>{ pending[name]--; });
  return queues[name];
}
async function pull(){
  if(!room) return;
  try{
    const all = await rpc("ftl_get", {p_room:room.id, p_secret:room.secret});
    online(true); let changed = false;
    for(const k of Object.keys(DEFAULTS)){
      const d = all[k]; if(!d || pending[k] || versions[k]===d.v) continue;
      versions[k] = d.v; S[k] = Object.assign({}, JSON.parse(JSON.stringify(DEFAULTS[k])), d.data); lsSet("ah_"+k, S[k]); changed = true;
    }
    if(!synced || changed){ synced = true; safeRender(); }
    turnAlert(changed);
  }catch(e){
    if(e.status===403 || e.status===400){ lsSet("ftl_room", null); room = null; render(); }
    else online(false);
  }
}

function pickCard(n, excludeId, drawer, sameDeck){
  drawer = drawer || me || "a";
  const role = drawer===bratKey() ? "brat" : "tamer";
  const recent = new Set((S.live.history||[]).concat(excludeId||[]));
  const hi = cooled() ? 0 : HEAT.indexOf(heatFor(Math.max(1,n)));
  /* Tamer cards wait until Him has answered two Yes Sir questions tonight, so he's eased in first. */
  const tamerOpen = ysTonight() >= 2;

}
function undressBase(t){ const A=avOf(t); return (A.night===today_() && A.base) ? A.base : 0; }

/* the piece you just took off flies away, the avatar bounces, hearts pop */
function flyOff(k,key){ try{
  document.querySelectorAll(`svg.avsvg[data-k="${k}"]`).forEach(svg=>{
    const g=svg.querySelector(`:scope > [data-piece="${key}"]`); const r=svg.getBoundingClientRect(); if(!g||!r.width||r.bottom<0||r.top>innerHeight) return;
    const c=svg.cloneNode(true); [...c.children].forEach(ch=>{ if(ch.tagName.toLowerCase()!=="defs" && ch.getAttribute("data-piece")!==key) ch.remove(); });
    c.setAttribute("class","flyoff"); Object.assign(c.style,{position:"fixed",left:r.left+"px",top:r.top+"px",width:r.width+"px",height:r.height+"px",zIndex:75,pointerEvents:"none"});
    c.style.setProperty("--fx",((Math.random()<.5?-1:1)*(50+Math.random()*50))+"px");
    document.body.append(c); setTimeout(()=>c.remove(),1000);
  }); }catch(e){} }

  if(r.width && r.bottom>0 && r.top<innerHeight) for(let i=0;i<5;i++){ const s=document.createElement("span"); s.className="avpop"; s.textContent="\u2665";
    s.style.left=(r.left+r.width*(.25+Math.random()*.5))+"px"; s.style.top=(r.top+r.height*(.3+Math.random()*.3))+"px"; s.style.animationDelay=(i*80)+"ms"; document.body.append(s); setTimeout(()=>s.remove(),1300+i*80); } }); }
function undress(){
  const t=other(me), P=piecesOf(t), rem=removedOf(t), i=rem.length;
  if(i>=P.length) return;
  const cost=pieceCosts(t)[i];
  if(heartsOf(me)<cost){ toast(`You need ${cost-heartsOf(me)} more \u2665`); return; }
  S.hearts=Object.assign({}, S.hearts||{}, {[me]: heartsOf(me)-cost}); save("hearts",[me]);
  const removed=rem.concat(P[i][0]);
  flyOff(t, P[i][0]);
  setAv(t, {removed, night:today_(), round:avOf(t).night===today_()?(avOf(t).round||0):0});
  try{ navigator.vibrate && navigator.vibrate(40); }catch(e){}
  if(removed.length===P.length) winReward(t); else render();
  setTimeout(()=>bounceAv(t), 40);
}

    $("h2",{style:"font-size:26px",text:"For the Lovers"}),
    $("p",{class:"muted",style:"margin:0",text:"Type your secret code to come in. This device remembers it after that."}),
    $("form",{class:"stack",style:"width:100%;gap:8px;text-align:left",onsubmit:async e=>{ e.preventDefault(); const v=codeIn.value.trim(); if(!v) return;
        go.disabled=true; go.textContent="Checking…";
        try{ const id=await rpc("ftl_join",{p_code:v}); if(id){ room={id, secret:v}; lsSet("ftl_room", room); location.reload(); return; } toast("That's not it. Try again."); }
        catch(err){ toast(/too many/.test(err.message)?"Too many tries. Wait a few minutes.":"Couldn't check the code. Check your connection."); }
        go.disabled=false; go.textContent="Open our game"; }},
      $("label",{for:"codeIn",class:"muted",style:"font-size:13px",text:"Secret code"}),
      $("div",{class:"row",style:"gap:6px;flex-wrap:nowrap"},$("div",{style:"flex:1;min-width:0"},codeIn),show),
      go),
    $("details",{class:"g-details",style:"width:100%;text-align:left"},$("summary",{text:"Have your private link instead?"}),
      $("form",{class:"stack",style:"gap:8px;margin-top:6px",onsubmit:e=>{ e.preventDefault(); const v=(document.getElementById("linkIn").value||"").trim(), m=v.match(/r=([0-9a-f-]{36})\.([A-Za-z0-9_-]{8,})/); if(!m){ toast("That doesn't look like your private link."); return; } location.hash="r="+m[1]+"."+m[2]; location.reload(); }},
        $("input",{id:"linkIn",placeholder:"Paste the link",autocomplete:"off"}),
        $("button",{class:"btn",type:"submit",text:"Open with the link"}))))];
}
function render(){
  const app=document.getElementById("app"); app.innerHTML="";
  if(!room){ const app=document.getElementById("app"); app.innerHTML=""; app.append(...viewLocked()); app.querySelector(".logo").innerHTML=LOGO_SVG; document.querySelector("nav.tabs").hidden=true; return; }
  document.querySelector("nav.tabs").hidden=false;
  if(!lsGet("ftl_onboarded",false)){ app.append(...viewOnboard()); document.querySelector("nav.tabs").hidden=true; return; }
  document.querySelector("nav.tabs").hidden=false;
  document.body.classList.toggle("pat", tab==="home");
  const v = tab==="rewards"?viewRewards():tab==="setup"?viewSetup():tab==="games"?viewGames():tab==="avatars"?viewAvatars():tab==="home"?viewHome():tab==="play"?viewPlay():tab==="memories"?viewMemories():tab==="limits"?viewBoundaries():viewSettings();
  app.append(...v.flat().filter(Boolean)); renderTabs();
  if(tab==="play"){ const acts=[...app.querySelectorAll(":scope > .actions")]; if(acts.length){ const bar=$("div",{class:"playbar"}); acts.forEach(a=>bar.append(a)); app.append(bar); } app.append(gamesLink()); }
  checkLevelUp(); checkBoundsReveal(); checkAvatarNews(); checkDailyNews(); checkGameNews(); checkRewardNews(); checkJarMilestone();
}
loadLocal(); render(); connect(); goFromHash();
</script>
