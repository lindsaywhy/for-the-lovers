<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0d1d16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="For the Lovers">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='100' cy='100' r='96' fill='%230d1d16' stroke='%23f4a6bf' stroke-width='8'/%3E%3Ctext x='100' y='132' text-anchor='middle' font-family='Impact,sans-serif' font-size='96' fill='%23f4a6bf'%3EYJ%3C/text%3E%3C/svg%3E">
<title>For the Lovers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Anton&family=Pinyon+Script&family=Outfit:wght@300;400;500;600;800&display=swap">
<style>
/* Layout: a single late-night screen — dashboard, a big playing card, and a tab bar along the bottom. Deliberately one dark look: his deep forest green, her pink. */
:root{
  --bg:#0d1d16;
  --bg2:#132a20;
  --surface:#1a3629;
  --line:#2c4d3e;
  --fg:#f7eef0;
  --muted:#a9c2b5;
  --rose:#f4a6bf;
  --amber:#f9cdd8;
  --deep:#0a1711;
  --d-know:#8fc4d9; --d-sweet:#f9cdd8; --d-flirty:#f4a6bf; --d-date:#9fd8a8; --d-dark:#e0609a; --d-wild:#e8d9b0; --d-brat:#ff6fae; --d-deep:#b9a7e8; --d-yesno:#ffb38a; --d-yessir:#7fd6c2; --d-music:#f2c27b;
  --display:"Gloock", Georgia, "Times New Roman", serif;
  --body:"Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(120% 60% at 50% -10%, #1f4a35 0%, transparent 60%);background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;font-weight:500}
.btn.primary{background:var(--rose);color:var(--deep);border-color:var(--rose)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top h1{font-size:30px;line-height:1.1}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:72px;height:72px;flex-shrink:0;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
.logo svg{width:100%;height:100%;display:block}
@media (max-width:380px){.logo{width:56px;height:56px}.top h1{font-size:24px}}
.top h1 em{font-style:normal;color:var(--rose)}
.who{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:transparent}
.sync{font-size:11px;color:var(--muted)}

/* dashboard */
.stats{display:grid;grid-template-columns:1fr;gap:12px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .big{font-family:var(--display);font-size:40px;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.stat .big small{font-family:var(--body);font-size:14px;color:var(--muted);margin-left:4px}
.cal{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.calgrid{display:flex;flex-wrap:wrap;gap:4px}
.calgrid span{width:7px;height:7px;border-radius:50%;background:var(--surface)}
.calgrid .on{background:var(--rose);box-shadow:0 0 6px #f4a6bf88}
.calgrid .today{outline:1px solid var(--amber);outline-offset:1px}
.goal{height:6px;background:var(--surface);border-radius:999px;overflow:hidden}
.goal i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--amber));border-radius:999px}
.start{font-family:var(--display);font-size:22px;padding:18px;border-radius:20px;border:0;background:linear-gradient(135deg,var(--rose),var(--amber));color:var(--deep);box-shadow:0 10px 30px #f4a6bf33}

/* heat + boundaries */
.heatwrap{display:flex;flex-direction:column;gap:6px}
.heat{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.heat i{height:6px;border-radius:999px;background:var(--surface)}
.heat i.lit{background:linear-gradient(90deg,var(--amber),var(--rose))}
.heat i.lit:last-child{background:var(--d-dark)}
.cool{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--amber)}
.cool .btn{align-self:flex-start}
.btn.sw{border-color:var(--d-dark);color:var(--d-dark);background:transparent}
.connect{display:flex;flex-direction:column;gap:6px}
.seg.wide{display:grid;grid-template-columns:repeat(3,1fr)}
.seg.wide button{padding:9px 6px}
.seg.wide button[aria-pressed="true"]{background:var(--rose);color:var(--deep)}
.card .stamp{position:absolute;top:18px;right:18px;z-index:2;transform:rotate(8deg);border:2px solid var(--d-date);color:#2c7a4f;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px;padding:3px 10px;border-radius:8px;background:#fdf3f5}
.card.done .text{opacity:.75}
.level{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip.paused{opacity:.45;border-style:dashed}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--fg)}
.pacein{display:flex;align-items:center;gap:6px;flex-shrink:0}
.pacein input{width:64px;text-align:center}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px solid var(--line)}
.srow>details{flex:1;min-width:0}
.lvl summary{list-style:none;cursor:pointer}
.lvl summary::-webkit-details-marker{display:none}
.stepper{display:flex;align-items:center;gap:6px;flex-shrink:0}
.stepper button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1;padding:0}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper output{min-width:26px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600;font-size:17px}
.switch{width:50px;height:30px;border-radius:999px;background:var(--surface);border:1px solid var(--line);position:relative;flex-shrink:0;padding:0;cursor:pointer}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:left .2s,background .2s}
.switch[aria-checked="true"]{background:var(--rose);border-color:var(--rose)}
.switch[aria-checked="true"]::after{left:23px;background:var(--deep)}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding-top:10px;border-top:1px solid var(--line)}
.bname{min-width:0}
.bline1{display:flex;align-items:center;gap:8px}
.seg.tight button{padding:6px 9px;font-size:12px}
.pdot{display:inline-block;width:10px;height:10px;border-radius:50%;flex-shrink:0;vertical-align:middle}
.pd-yes{background:var(--d-date)}.pd-maybe{background:var(--amber)}.pd-no{background:var(--d-dark)}.pd-none{border:1.5px solid var(--muted);box-sizing:border-box}
.legend2{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.sumgrp{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.sumgrp b{font-size:13px;font-weight:600}
.chip.c-yes{border-color:var(--d-date);color:var(--d-date)}.chip.c-maybe{border-color:var(--amber);color:var(--amber)}.chip.c-no{border-color:var(--d-dark);color:var(--d-dark)}
.prog{flex:1;height:5px;border-radius:999px;background:var(--surface);overflow:hidden;margin:0 10px;min-width:30px}
.prog i{display:block;height:100%;background:var(--rose)}
.stack{display:flex;flex-direction:column;gap:6px}
.wtop{display:flex;align-items:center;gap:10px}
.wtop .prog{flex:1}
.wcard{gap:16px;padding:22px 18px}
.wq{font-size:26px;line-height:1.2}
.wp{margin:0;font-size:15px;line-height:1.55}
.wkey{display:flex;flex-direction:column;gap:8px;font-size:14px;background:var(--surface);border-radius:14px;padding:12px 14px}
.wgame{display:flex;flex-direction:column;gap:4px;background:#fdf3f5;color:#163024;border-radius:14px;padding:12px 14px;font-family:var(--display);font-size:17px;line-height:1.3}
.wgame .eyebrow{font-family:var(--body);color:#5b7a6a}
.wtip{font-size:13px;line-height:1.5;border-left:3px solid var(--amber);padding:2px 0 2px 10px;color:var(--fg)}
.wans{display:flex;flex-direction:column;gap:8px}
.wans.row3{flex-direction:row}
.wans.row3 .wbtn{flex:1;padding:10px 6px;font-size:13px}
.wbtn{width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:500}
.wans.row3 .wbtn{text-align:center}
.wbtn.wb-yes[aria-pressed="true"]{background:var(--d-date);color:var(--deep);border-color:var(--d-date)}
.wbtn.wb-maybe[aria-pressed="true"]{background:var(--amber);color:var(--deep);border-color:var(--amber)}
.wbtn.wb-no[aria-pressed="true"]{background:var(--d-dark);color:var(--deep);border-color:var(--d-dark)}
.wpair{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line)}
.wnav{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wbig{align-self:stretch;padding:14px;font-size:16px}
.wpromo{border-color:var(--rose)}
.checkin{text-align:center;font-size:13px;color:var(--amber);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.nudge{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--rose);border-radius:16px;padding:12px 14px}
.bline{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-shrink:0}
.seg button{background:transparent;border:0;padding:6px 12px;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button:disabled{cursor:default}
.seg .seg-yes[aria-pressed="true"]{background:var(--d-date);color:var(--deep)}
.seg .seg-maybe[aria-pressed="true"]{background:var(--amber);color:var(--deep)}
.bgroup summary{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;list-style:none}
.bgroup summary::-webkit-details-marker{display:none}
.bgroup summary::after{content:"+";color:var(--muted);font-size:20px}
.bgroup[open] summary::after{content:"\2013"}
.bgroup[open] summary{margin-bottom:4px}
.theirs{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.02em}
.theirs.no{color:var(--d-dark)}
.seg .seg-no[aria-pressed="true"]{background:var(--d-dark);color:var(--deep)}

/* play */
.turn{font-family:var(--display);font-size:22px;text-align:center}
.turn em{font-style:normal;color:var(--rose)}
.stage{perspective:1200px;display:flex;justify-content:center}
.card{width:100%;max-width:380px;aspect-ratio:5/7;border-radius:24px;background:linear-gradient(160deg,#fdf3f5,#f6dfe6);color:#163024;padding:22px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 24px 60px #00000080,0 0 0 1px #ffffff20;position:relative;overflow:hidden}
.card::after{content:"";position:absolute;inset:10px;border:1px solid color-mix(in srgb,var(--dc) 70%,transparent);border-radius:16px;pointer-events:none}
.card .deck{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:#2c5a43;position:relative;z-index:1}

.card .kind{font-size:10px;letter-spacing:.12em;padding:4px 9px;border-radius:999px;white-space:nowrap}
.card .kind-ask{background:#163024;color:#fdf3f5}
.card .kind-do{background:var(--dc);color:#163024}
.card .text{font-family:var(--display);font-size:clamp(22px,6vw,30px);line-height:1.2;text-wrap:balance;position:relative;z-index:1}
.card .foot{display:flex;justify-content:space-between;font-size:12px;color:#5b7a6a;position:relative;z-index:1}
.card.back{background:radial-gradient(circle at 50% 40%,#235a40,#0f2419);color:var(--fg);align-items:center;justify-content:center;text-align:center;gap:10px}
.card.back .text{font-size:24px}
.card.swipeable{touch-action:pan-y;cursor:grab;transition:transform .22s ease,opacity .22s ease;user-select:none}
.card.swipeable.dragging{transition:none;cursor:grabbing}
.card.flip{animation:flip .55s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{from{transform:rotateY(80deg) translateY(10px);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card.flip{animation:none}}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.reveal{background:var(--surface);border:1px solid var(--amber);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.mission{background:var(--bg2);border:1px dashed var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.mission .secret{font-family:var(--display);font-size:18px}

/* memories */
.mem{display:flex;flex-direction:column;gap:10px}
.memitem{background:var(--bg2);border:1px solid var(--line);border-left:4px solid var(--dc);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.memitem p{margin:0;font-family:var(--display);font-size:17px;line-height:1.3}
.memitem small{color:var(--muted);font-size:12px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;border:1px dashed var(--line);border-radius:16px}

/* settings */
.form{display:flex;flex-direction:column;gap:14px;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:12px;color:var(--muted);letter-spacing:.06em}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.customlist{display:flex;flex-direction:column;gap:6px;font-size:13px}
.customlist div{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.customlist span{min-width:0}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#0d1d16f2;backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:max(10px,env(safe-area-inset-bottom,0px));padding-top:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
nav.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{background:transparent;border:0;border-radius:12px;padding:8px 2px;font-size:11px;min-width:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:20px;height:20px}
nav.tabs button[aria-current="page"]{color:var(--rose);background:var(--surface)}
nav.tabs button.tab-play{background:var(--rose);color:var(--deep);font-weight:600}
nav.tabs button.tab-play[aria-current="page"]{background:var(--rose);color:var(--deep);box-shadow:0 0 0 2px var(--amber)}

/* who overlay */
.overlay{position:fixed;inset:0;background:#0a1711ee;display:grid;place-items:center;z-index:20;padding:20px}
.overlay .box{background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:24px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center}
.overlay .box h2{font-size:26px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--amber);color:var(--deep);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:500;z-index:30}
@media (max-width:380px){.stats{grid-template-columns:1fr}}
</style>
<style>[hidden]{display:none!important}html{padding-top:env(safe-area-inset-top,0px)}body{margin:0}</style>
</head>
<body>

<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Sections"><div id="tabs"></div></nav>
<div class="overlay" id="whoBox" hidden>
  <div class="box">
    <h2>Who's playing?</h2>
    <p class="muted" style="margin:0">So the game knows whose turn it is on this phone.</p>
    <div class="row" style="justify-content:center" id="whoBtns"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const DECKS = {
  know:  {name:"Get to Know You", color:"var(--d-know)"},
  sweet: {name:"Sweet", color:"var(--d-sweet)"},
  flirty:{name:"Flirty", color:"var(--d-flirty)"},
  date:  {name:"Date Night", color:"var(--d-date)"},
  dark:  {name:"After Dark", color:"var(--d-dark)"},
  wild:  {name:"Wild Card", color:"var(--d-wild)"},
  brat:  {name:"Brat", color:"var(--d-brat)"},
  deep:  {name:"Deep Talk", color:"var(--d-deep)"},
  yesno: {name:"Be Honest", color:"var(--d-yesno)"},
  yessir:{name:"Yes Sir", color:"var(--d-yessir)"},
  jyesno:{name:"Be Honest", color:"var(--d-yesno)"},
  music: {name:"Soundtrack", color:"var(--d-music)"}
};
/* Every card: t = text, g = boundary topics, r = who draws it ("brat" = Her, "tamer" = Him), lvl = earliest heat stage.
   {you} = the other person, {brat} = Her, {tamer} = Him. Ask decks are questions for the other person; the rest are for whoever drew. */
const ASK_DECKS = ["know","deep","yesno","jyesno","yessir"];
/* Which levels each card belongs to (0 Slow Jams, 1 Catching Feelings, 2 Late Night, 3 No Skips).
   Most cards follow their category; the ones listed in LV_CARD are placed by their own vibe. */
const LV_DECK = {music:[0], know:[0,1], sweet:[0,1], date:[0,1], wild:[0,1], deep:[1], flirty:[1,2], dark:[3], brat:[2,3]};
const LV_CARD = {
  "flirty-0":[2,3],"flirty-2":[2,3],"flirty-3":[1],"flirty-4":[2,3],"flirty-5":[2],"flirty-8":[1],"flirty-10":[2,3],"flirty-11":[2,3],"flirty-12":[1],"flirty-14":[2,3],"flirty-15":[2,3],
  "dark-1":[2,3],"dark-2":[2,3],"dark-5":[2,3],"dark-8":[2,3],"dark-13":[2,3],"dark-14":[2,3],"dark-16":[2,3],"dark-17":[2,3],
  "deep-15":[1,2],"deep-16":[1,2],"deep-17":[1,2],"deep-20":[1,2],"deep-22":[1,2],
  "wild-5":[2,3],"wild-6":[2,3],"wild-7":[2,3],
  "date-8":[1],"sweet-14":[1]};
function lvOf(deck, i, x){ const id=deck+"-"+i; if(LV_CARD[id]) return LV_CARD[id]; if(x && x.lvl) return [x.lvl]; return LV_DECK[deck] || [0,1,2,3]; }
const CARDS = {
know:[
 {t:"What's the one food you'd eat every day if nobody was watching?"},
 {t:"What song takes you straight back to being 16?"},
 {t:"What were you obsessed with when you were little?"},
 {t:"If you could wake up great at one thing tomorrow, what you picking?"},
 {t:"What's the best compliment somebody ever gave you?"},
 {t:"Walk me through your perfect lazy Sunday."},
 {t:"What's a little thing I do that you secretly love?"},
 {t:"Okay, be honest. What did you think the first time you saw me?"},
 {t:"Who in my circle you think you'd click with the most?"},
 {t:"Where's a place you've been that you'd want to take me?"},
 {t:"What's something you believe that you know most people would argue with you about?"},
 {t:"What's something you're proud of this month?"},
 {t:"Free weekend, money's not an issue. What are we doing?"},
 {t:"What's a habit you got that you think I haven't noticed yet?"},
 {t:"What would younger you think of your life right now?"},
 {t:"What's the funniest thing that happened to you this week?"},
 {t:"What's one thing you want us to do together this year?"},
 {t:"What's that one movie you'll stop and watch every time it comes on?"},
 {t:"What makes you feel the most loved? Words, touch, time, gifts, or somebody helping you out?"}
],

function wizSteps(){
  const st=[{t:"intro"}];

    st.push({t:"group",g});

    (g.pairs||[]).forEach(([k,name])=>st.push({t:"pair",k,name,g:g.title}));
    if(g.parts) st.push({t:"body",g});
  }
  st.push({t:"custom"},{t:"done"});
  return st;
}
function stepDone(s){
  if(s.t==="item") return !!answer(me,s.k);
  if(s.t==="pair") return !!answer(me,s.k+":give") && !!answer(me,s.k+":get");
  if(s.t==="body") return s.g.parts.every(p=>answer(me,"body:"+p));
  return true;
}

  const st=wizSteps(), saved=lsGet("ftl_wiz",null);

  else { const fo=st.findIndex(x=>["item","pair","body"].includes(x.t) && !stepDone(x)); wiz = (fo<=2) ? 0 : fo; }
  render(); window.scrollTo(0,0);
}
function wizGo(i){ const n=wizSteps().length; wiz=Math.max(0,Math.min(n-1,i)); lsSet("ftl_wiz",wiz); render(); window.scrollTo(0,0); }
